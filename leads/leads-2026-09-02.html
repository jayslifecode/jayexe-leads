<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Intel — 2026-09-02</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #07070f;
      --surface: #0e0e1c;
      --surface2: #141428;
      --border: rgba(255,255,255,0.07);
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #2d3748;
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Playfair Display', Georgia, serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ── Header ── */
    .site-header {
      background: linear-gradient(180deg, rgba(245,158,11,0.06) 0%, transparent 100%);
      border-bottom: 1px solid rgba(245,158,11,0.15);
      padding: 28px 24px 22px;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-title {
      font-family: var(--serif);
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .header-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--amber);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0.8;
    }

    .header-stat {
      text-align: right;
    }

    .stat-number {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      color: var(--amber);
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Filters ── */
    .filters-bar {
      max-width: 900px;
      margin: 20px auto 0;
      padding: 0 24px;
    }

    .filters-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .fg {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .fg label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .fg select, .fg input[type="number"] {
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--mono);
      min-width: 130px;
      outline: none;
      transition: border-color 0.2s;
    }

    .fg select:focus, .fg input:focus {
      border-color: rgba(245,158,11,0.4);
    }

    .fg input[type="number"] { min-width: 70px; }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--mono);
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
      align-self: flex-end;
    }

    .btn-reset:hover { border-color: var(--amber); color: var(--amber); }

    .filter-count {
      margin-left: auto;
      align-self: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .filter-count span { color: var(--amber); font-weight: 700; }

    /* ── Cards ── */
    .cards-wrap {
      max-width: 900px;
      margin: 20px auto 0;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lead-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 18px 14px;
      opacity: 0;
      transform: translateY(12px);
      animation: cardIn 0.4s ease forwards;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .lead-card:hover {
      border-color: rgba(245,158,11,0.2);
      box-shadow: 0 0 0 1px rgba(245,158,11,0.08), 0 8px 32px rgba(0,0,0,0.4);
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .lead-card.hidden { display: none; }

    /* card top row */
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .card-score { flex-shrink: 0; }
    .score-ring { display: block; }

    .card-identity { flex: 1; min-width: 0; }

    .card-identity h2 {
      font-family: var(--serif);
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 5px;
    }

    .meta-loc, .meta-cat {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .meta-cat::before { content: '·'; margin-right: 8px; }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .badge {
      font-size: 9px;
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid;
      white-space: nowrap;
    }

    /* contact row */
    .card-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .contact-chip {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 5px;
      padding: 4px 9px;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    a.contact-chip:hover { color: var(--amber); border-color: rgba(245,158,11,0.3); }

    .link-chip a {
      color: inherit;
      text-decoration: none;
    }

    .link-chip a.link-demo { color: #8b5cf6; }
    .link-chip:hover { color: var(--cyan); border-color: rgba(6,182,212,0.3); }

    /* action row */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s;
    }

    .btn-approve {
      background: rgba(16,185,129,0.12);
      border-color: rgba(16,185,129,0.25);
      color: #10b981;
    }
    .btn-approve:hover { background: rgba(16,185,129,0.22); }

    .btn-reject {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.2);
      color: #ef4444;
    }
    .btn-reject:hover { background: rgba(239,68,68,0.2); }

    .btn-demo {
      background: rgba(139,92,246,0.12);
      border-color: rgba(139,92,246,0.25);
      color: #8b5cf6;
    }
    .btn-demo:hover { background: rgba(139,92,246,0.22); }
    .btn-demo.loading { opacity: 0.5; cursor: not-allowed; }
    .btn-demo.done { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: #10b981; }

    /* empty state */
    .no-leads {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <div class="header-title">Lead Intel</div>
        <div class="header-sub">↳ 2026-09-02</div>
      </div>
      <div class="header-stat">
        <div class="stat-number" id="visible-count">0</div>
        <div class="stat-label">leads found</div>
      </div>
    </div>
  </header>

  

  <div class="cards-wrap">
    <div class="no-leads"><p>No leads found for this date.</p></div>
  </div>

  <script>
    const GITHUB_OWNER = 'undefined';
    const GITHUB_REPO = 'undefined';

    function applyFilters() {
      const category = document.getElementById('filter-category')?.value ?? '';
      const location = document.getElementById('filter-location')?.value ?? '';
      const flag = document.getElementById('filter-flag')?.value ?? '';
      const minScore = parseInt(document.getElementById('filter-min-score')?.value ?? '0', 10);
      const sortOrder = document.getElementById('sort-order')?.value ?? 'desc';

      const cards = Array.from(document.querySelectorAll('.lead-card'));

      cards.forEach(card => {
        const el = card;
        const cardCity = el.dataset.location?.split(',').slice(-3).join(',').trim() ?? '';
        const matchCat = !category || el.dataset.category === category;
        const matchLoc = !location || cardCity === location;
        const matchFlag = !flag || el.dataset.flag === flag;
        const score = parseInt(el.dataset.score ?? '0', 10);
        const matchScore = score >= minScore;
        el.classList.toggle('hidden', !(matchCat && matchLoc && matchFlag && matchScore));
      });

      const visible = cards.filter(c => !c.classList.contains('hidden'));
      const countEl = document.getElementById('visible-count');
      const labelEl = document.getElementById('filter-label');
      if (countEl) countEl.textContent = visible.length.toString();
      if (labelEl) labelEl.textContent = visible.length.toString();

      const parent = cards[0]?.parentNode;
      if (parent) {
        visible
          .sort((a, b) => {
            const sa = parseInt(a.dataset.score ?? '0', 10);
            const sb = parseInt(b.dataset.score ?? '0', 10);
            return sortOrder === 'desc' ? sb - sa : sa - sb;
          })
          .forEach(card => parent.appendChild(card));
      }
    }

    function resetFilters() {
      ['filter-category','filter-location','filter-flag','filter-min-score','sort-order'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === 'filter-min-score') el.value = '0';
        else if (id === 'sort-order') el.value = 'desc';
        else el.value = '';
      });
      applyFilters();
    }

    ['filter-category','filter-location','filter-flag','filter-min-score','sort-order'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', applyFilters);
    });

    async function approveDemoLead(btn) {
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt('Paste your GitHub personal access token (stored in browser localStorage only):');
        if (!token) return;
        localStorage.setItem('gh_token', token);
      }

      btn.disabled = true;
      btn.classList.add('loading');
      btn.textContent = 'Approving...';

      const leadId = btn.dataset.id;
      const filePath = 'leads/leads-master.json';
      const apiBase = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + filePath;

      try {
        const getRes = await fetch(apiBase, {
          headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
        });
        if (!getRes.ok) throw new Error('GitHub GET failed: ' + getRes.status);
        const fileData = await getRes.json();
        const sha = fileData.sha;

        // Files > 1MB return content: null — fetch raw content from download_url instead
        let jsonText;
        if (fileData.content) {
          jsonText = atob(fileData.content.replace(/\n/g, ''));
        } else {
          const rawRes = await fetch(fileData.download_url);
          jsonText = await rawRes.text();
        }

        const leads = JSON.parse(jsonText);
        const updated = leads.map(l => l.id === leadId ? { ...l, status: 'demo_requested' } : l);

        // encodeURIComponent+unescape handles non-ASCII chars in business names
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2))));

        const putRes = await fetch(apiBase, {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: 'chore: approve lead ' + leadId + ' for demo',
            content: encoded,
            sha,
          })
        });
        if (!putRes.ok) throw new Error('GitHub PUT failed: ' + putRes.status);

        btn.textContent = 'Approved ✓';
        btn.classList.remove('loading');
        btn.classList.add('done');
      } catch (err) {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.textContent = 'Approve for Demo';
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
